# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true

android.useAndroidX=true
android.enablePngCrunchInReleaseBuilds=true

reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
newArchEnabled=true
hermesEnabled=true

expo.gif.enabled=true
expo.webp.enabled=true
expo.webp.animated=false

EX_DEV_CLIENT_NETWORK_INSPECTOR=true
expo.useLegacyPackaging=false

android.enableProguardInReleaseBuilds=true
android.extraMavenRepos=[{"url":"../../node_modules/@notifee/react-native/android/libs"}]

# Release signing credentials (ensure keystore file exists in android/app/)
MYAPP_UPLOAD_STORE_FILE=my-upload-key.keystore
MYAPP_UPLOAD_KEY_ALIAS=my-key-alias
MYAPP_UPLOAD_STORE_PASSWORD=***
MYAPP_UPLOAD_KEY_PASSWORD=***

# Force-lock the Kotlin and KSP pipeline globally across all sub-modules
# Align project with Expo's native Kotlin 2.0 compiler pipeline
kotlinVersion=2.1.20
kspVersion=2.1.20-2.0.1
android.kotlinVersion=2.1.20
android.kspVersion=2.1.20-2.0.1