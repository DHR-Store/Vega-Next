// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: '35.0.0'
        minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '24')
        compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '35')
        targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '34')
        kotlinVersion = findProperty('kotlinVersion') ?: '2.1.20'
        kspVersion = findProperty('kspVersion') ?: '2.1.20-2.0.1'
        ndkVersion = "28.0.13004108"
    }

    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }   // ✅ Fixed JitPack URL
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("com.google.gms:google-services:4.3.15")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }   // ✅ Fixed JitPack URL

        // React Native Android binaries
        maven {
            url(new File(['node', '--print', "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), '../android'))
        }

        // Android JSC binaries
        maven {
            url(new File(['node', '--print', "require.resolve('jsc-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), '../dist'))
        }
    }
}

// Optional: Force certain versions to avoid conflicts
subprojects {
    // ✅ Fixed: Direct configurations access to comply with strict Gradle 8+ isolated projects
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            // Enforce React Native version harmony
            if (details.requested.group == 'com.facebook.react' && details.requested.name.contains('react-native')) {
                details.useVersion "0.81.5"   // Matches your RN version
            }
            
            // Fix: Force uniform OkHttp version to eliminate "NoClassDefFoundError: Lokhttp3/internal/Util" crash
            if (details.requested.group == 'com.squareup.okhttp3') {
                details.useVersion "4.12.0"
            }
        }
    }
}